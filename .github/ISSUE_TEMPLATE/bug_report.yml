name: Bug report
description: Report a reproducible Winnow problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Winnow more reliable.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
      placeholder: Winnow compressed or passed through...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe example that reproduces the issue. Remove secrets.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Winnow version
      description: Output of `wn --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs, screenshots, or other relevant details. Do not include credentials.
