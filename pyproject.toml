[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnow-cli"
version = "0.1.1"
description = "Winnow the noise out of your CLI output — keep the grain, stash the chaff, recall it anytime."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Farhan Almutairi" }]
keywords = ["cli", "tokens", "llm", "compression", "context", "agents", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Farhanward/winnow"
Repository = "https://github.com/Farhanward/winnow"
Issues = "https://github.com/Farhanward/winnow/issues"
Changelog = "https://github.com/Farhanward/winnow/blob/main/CHANGELOG.md"

[project.scripts]
winnow = "winnow.cli:main"
wn = "winnow.cli:main"

[tool.setuptools]
packages = ["winnow", "winnow.filters", "winnow.rules_data"]

[tool.setuptools.package-data]
"winnow.rules_data" = ["*.yaml"]
