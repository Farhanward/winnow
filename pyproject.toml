[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnow-cli"
version = "0.1.0"
description = "Winnow the noise out of your CLI output — keep the grain, stash the chaff, recall it anytime."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Winnow contributors" }]
keywords = ["cli", "tokens", "llm", "compression", "context", "agents", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/OWNER/winnow"
Repository = "https://github.com/OWNER/winnow"
Issues = "https://github.com/OWNER/winnow/issues"

[project.scripts]
winnow = "winnow.cli:main"
wn = "winnow.cli:main"

[tool.setuptools]
packages = ["winnow", "winnow.filters", "winnow.rules_data"]

[tool.setuptools.package-data]
"winnow.rules_data" = ["*.yaml"]
